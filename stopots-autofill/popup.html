<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopots Auto-Fill</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>Stopots Auto-Fill</h1>
        <div class="toggle-container">
            <span class="label">Ativado</span>
            <label class="switch">
                <input type="checkbox" id="toggle">
                <span class="slider"></span>
            </label>
        </div>
        <p class="status" id="status">Desativado</p>
    </div>
    <script src="popup.js"></script>
</body>
</html>
